    runtimeOnly localOrDeobfDependency("mezz.jei:jei-${minecraft_version}:${jei_version}", parchmentMappedJarPatterns('jei-1.18.2-9.7.2.1001'), ['jei-1.18.2-9.7.2.1001.jar'])

    compileOnly annotationProcessor("io.github.llamalad7:mixinextras-common:${mixinextras_version}")

    implementation(jarJar('me.fallenbreath:conditional-mixin-forge:0.6.4')) {
        jarJar.ranged(it, "[0.6.4,)")
    }

    implementation(jarJar("io.github.llamalad7:mixinextras-forge:${mixinextras_version}")) {
        jarJar.ranged(it, "[${mixinextras_version},)")
