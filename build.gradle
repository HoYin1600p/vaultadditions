}

mixin {
    add sourceSets.main, "${mod_id}.mixin-refmap.json"
    config "${mod_id}.mixin.json"
}

jar {
    archiveClassifier.set('')
    manifest {
        attributes([
                "Specification-Title"     : "${mod_id}",
                "Specification-Vendor"    : "${mod_id}sareus",
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : "${mod_id}sareus",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

jar.finalizedBy('reobfJar')

tasks.named('jarJar', Jar).configure {
    enabled = false
}

tasks.matching { it.name == 'reobfJarJar' }.configureEach {
    enabled = false
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
